<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260">
  <title>Voltage–strain fusion for state-of-charge estimation</title>
  <desc>Voltage and strain inputs lead to SOC estimation and a parallel mismatch monitor.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#d8cfbf" stroke-opacity=".4"/></pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m0 0 7 3.5L0 7" fill="#164f8b"/></marker>
  </defs>
  <rect width="400" height="260" fill="#f4efe6"/>
  <rect width="400" height="260" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="24" y="29" font-size="11" font-weight="700" letter-spacing="2" fill="#a94a21">VOLTAGE + STRAIN / SOC</text>
    <g fill="#fffaf2" stroke="#b8c6cd" stroke-width="1.5">
      <rect x="24" y="54" width="120" height="54" rx="7"/>
      <rect x="24" y="133" width="120" height="54" rx="7"/>
      <rect x="221" y="71" width="155" height="68" rx="7"/>
      <rect x="221" y="164" width="155" height="48" rx="7"/>
    </g>
    <g fill="none" stroke="#164f8b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M144 81h38v14h36"/>
      <path d="M144 160h38v-44h36"/>
      <path d="M182 116v72h36"/>
    </g>
    <g text-anchor="middle" fill="#164f8b" font-size="15">
      <text x="84" y="87">Voltage</text>
      <text x="84" y="166">Strain</text>
      <text x="298" y="99" font-weight="700">Fusion estimator</text>
      <text x="298" y="122" font-size="12" fill="#555">State of charge</text>
      <text x="298" y="193" font-size="13" fill="#a94a21">Mismatch monitor</text>
    </g>
    <text x="24" y="240" font-size="10" letter-spacing="1" fill="#555">OPTIMALITY · FRAGILITY · DETECTION</text>
  </g>
</svg>
