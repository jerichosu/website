<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Jiayi Su</title>
  <link rel="icon" type="image/png" href="images/icons/seal_icons.png">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{display:flex;flex-direction:column;background:#faf8f4;color:#1a1917;
         font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;
            padding:8px 16px;border-bottom:1px solid #e6e0d6;font-size:13px;color:#4e4b45}
    .topbar a{color:#184e86;text-decoration:none}
    #view{flex:1 1 auto;border:0;width:100%}
    .hidden-tracker{position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden}
  </style>
  <script defer src="js/visitor-map.js"></script>
</head>
<body>
  <div class="topbar"><a href="index.html">&larr; jiayisu.com</a></div>
  <iframe id="view" title="document"></iframe>

  <script>
    (function(){
      var p = new URLSearchParams(location.search).get('f') || '';
      var ok = p
        && !/^(https?:)?\/\//i.test(p)
        && !/^[a-zA-Z][\w+.-]*:/.test(p)
        && !p.includes('..')
        && !p.includes('\\');
      var f = document.getElementById('view');
      if(!ok){ location.replace('index.html'); return; }
      f.src = encodeURI(p.replace(/^\/+/, ''));
    })();
  </script>
</body>
</html>
